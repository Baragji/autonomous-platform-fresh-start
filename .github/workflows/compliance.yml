name: Constitutional Compliance

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run compliance
        continue-on-error: true
        env:
          COMPLIANCE_REQUIRE_OPENAPI: "1"
        run: |
          npm run compliance || echo "Compliance reported failures (non-blocking)"

      - name: Upload SARIF Report
        if: always() && hashFiles('.automation/evidence/compliance/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .automation/evidence/compliance/report.sarif
          category: constitutional-compliance
