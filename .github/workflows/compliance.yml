name: Constitutional Compliance

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run compliance
        continue-on-error: true
        env:
          COMPLIANCE_REQUIRE_OPENAPI: "1"
        run: |
          npm run compliance || echo "Compliance reported failures (non-blocking)"

      - name: Ensure SARIF report exists
        if: always()
        run: |
          mkdir -p .automation/evidence/compliance
          if [ ! -f .automation/evidence/compliance/report.sarif ]; then
            # Attempt to aggregate partial SARIF outputs even if compliance chain aborted
            npm run compliance:aggregate || true
          fi
          if [ ! -f .automation/evidence/compliance/report.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > .automation/evidence/compliance/report.sarif
          fi

      - name: Upload SARIF Report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .automation/evidence/compliance/report.sarif
          category: constitutional-compliance
