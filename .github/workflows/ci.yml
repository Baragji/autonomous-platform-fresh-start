        run: |
          for p in 3030 7010 7020; do
            echo "Waiting for :$p";
            for i in {1..60}; do
              (echo > /dev/tcp/127.0.0.1/$p) >/dev/null 2>&1 && break
              sleep 1
            done
          done

      - name: Run e2e smoke via Week 2 collector
        shell: bash
        run: |
          chmod +x .automation/evidence/week2/collect_evidence.sh
          DEBUG_EVIDENCE=1 ./.automation/evidence/week2/collect_evidence.sh
          echo "--- SUMMARY"; cat .automation/evidence/week2/WEEK2_SUMMARY.md
          if grep -q "FAIL" .automation/evidence/week2/WEEK2_SUMMARY.md; then
            echo "Smoke failed"; exit 1; fi

      - name: Dump service logs on failure
