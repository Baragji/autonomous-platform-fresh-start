name: CI

on:
  push:
    branches:
      - main
      - release/*
      - secure_hardening_*
  pull_request:
    branches:
      - main
      - release/*
      - secure_hardening_*

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umca
          POSTGRES_PASSWORD: umcapassword
          POSTGRES_DB: umca
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5432/umca
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      GRAFANA_URL: http://localhost:3001
      OPENAI_API_KEY: dummy
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      CI_ENFORCE_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Start MinIO
        run: |
          docker run -d --name umca-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_ROOT_PASSWORD=${{ secrets.MINIO_SECRET_KEY }} \
            --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' umca-minio | grep -q healthy; then
              echo "MinIO healthy"; break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          docker inspect --format='{{.State.Health.Status}}' umca-minio | grep -q healthy || { echo "MinIO not healthy"; docker logs umca-minio; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: |
          mkdir -p .automation/evidence
          npm test -- --coverage --run
          npm test -- --reporter=json --run | tee .automation/evidence/ci-tests.json

      - name: Validator tests with coverage
        run: npm run test:validator -- --coverage --run

      - name: Enforce coverage threshold
        run: npm run compliance:coverage

      - name: Enforce validator coverage threshold
        run: npm run compliance:validator-coverage

      - name: No skipped tests
        run: VITEST_JSON_PATH=.automation/evidence/ci-tests.json npm run ci:no-skips

      - name: Evidence | collect-coverage, healthz, env-guard, e2e, readiness
        run: |
          mkdir -p .automation/evidence
          npx tsx scripts/collect-coverage.ts
          npx tsx scripts/collect-healthz.ts || true
          # Build shared so env dist entry exists
          npm --prefix packages/shared run build
          npx tsx scripts/collect-env-guard.ts
          # Attempt full chain; capture evidence even if run fails
          npx tsx scripts/run-e2e-intent.ts || true
          npx tsx scripts/generate-readiness-report.ts

      - name: Evidence | Attest (CI)
        run: |
          bash scripts/attest-evidence.sh
          cp .automation/evidence/ATTACHMENT_MANIFEST.json .automation/evidence/ATTACHMENT_MANIFEST.ci.json

      - name: Evidence | Ban narrative prose
        run: |
          set -e
          if rg -n --ignore-case --no-heading "(I can't run the stack|I cant run the stack|I'll need to|will regenerate|we believe|should be fine|TODO|FIXME)" .automation/evidence/; then
            echo "Narrative prose detected in evidence directory" >&2
            exit 1
          fi

      - name: Evidence | Ensure validator executed (fail if skipped)
        run: |
          set -e
          test -f .automation/evidence/v5-report.json || { echo "Missing v5-report.json"; exit 1; }
          touched=$(jq -r '.e2e.touched_validator' .automation/evidence/v5-report.json || echo false)
          if [ "$touched" != "true" ]; then
            echo "Validator was not executed in e2e trace" >&2
            cat .automation/evidence/v5-report.json || true
            exit 1
          fi

      - name: Evidence | Compare CI vs committed hashes (if manifest present)
        run: |
          set -e
          if [ -f .automation/evidence/ATTACHMENT_MANIFEST.json ]; then
            jq -r '.files[] | "\(.path) \(.sha256)"' .automation/evidence/ATTACHMENT_MANIFEST.json | sort > /tmp/branch.hashes || true
          else
            : > /tmp/branch.hashes
          fi
          jq -r '.files[] | "\(.path) \(.sha256)"' .automation/evidence/ATTACHMENT_MANIFEST.ci.json | sort > /tmp/ci.hashes
          if [ -s /tmp/branch.hashes ]; then
            comm -12 <(cut -d' ' -f1 /tmp/branch.hashes) <(cut -d' ' -f1 /tmp/ci.hashes) | while read p; do
              bh=$(grep -E "^$p " /tmp/branch.hashes | awk '{print $2}')
              ch=$(grep -E "^$p " /tmp/ci.hashes | awk '{print $2}')
              if [ "$bh" != "$ch" ]; then
                echo "Hash mismatch for $p" >&2
                exit 1
              fi
            done
          fi
          echo "Evidence compare OK"

      - name: Capture prod guard failure evidence
        run: |
          mkdir -p .automation/evidence
          set +e
          OUTPUT=$(NODE_ENV=production \
            OPENAI_API_KEY= \
            DATABASE_URL=postgresql://umca:umcapassword@localhost:5432/umca \
            MINIO_ACCESS_KEY=minioadmin \
            MINIO_SECRET_KEY=minioadmin \
            node -e "require('./packages/shared/src/env');" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT" | tee .automation/evidence/ci_guard_failure.txt
          if [ "$STATUS" -eq 0 ]; then
            echo "Expected env guard to exit with failure" >&2
            exit 1
          fi

      - name: Capture prod guard success evidence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mkdir -p .automation/evidence
          : "${OPENAI_API_KEY:=sk-test-123}"
          : "${MINIO_ACCESS_KEY:=strongaccess}"
          : "${MINIO_SECRET_KEY:=strongsecret}"
          set +e
          OUTPUT=$(NODE_ENV=production \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            DATABASE_URL=postgresql://umca:SuperSecureP@ssw0rd@localhost:5432/umca \
            MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            node -e "require('./packages/shared/src/env');" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT" | tee .automation/evidence/ci_guard_success.txt
          if [ "$STATUS" -ne 0 ]; then
            echo "Expected env guard to succeed" >&2
            exit 1
          fi

  openai-check:
    name: OpenAI Connectivity (staging)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --fund=false
      - name: Validate OpenAI key
        run: npm run ci:validate-openai

  smoke-staging:
    name: smoke-staging (e2e)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umca
          POSTGRES_PASSWORD: umcapassword
          POSTGRES_DB: umca
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5432/umca
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      LANGFUSE_PUBLIC_KEY: dummy
      LANGFUSE_SECRET_KEY: dummy
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --fund=false
      - name: Start MinIO
        run: |
          docker run -d --name umca-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_ROOT_PASSWORD=${{ secrets.MINIO_SECRET_KEY }} \
            --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            quay.io/minio/minio:latest server /data --console-address ":9001"
      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' umca-minio | grep -q healthy; then
              echo "MinIO healthy"; break
            fi
            sleep 2
          done
      - name: Start services
        run: |
          nohup npm --prefix packages/gateway run dev >/tmp/gw.log 2>&1 &
          nohup env WEEK2_PLANNER_ONLY=1 npm --prefix packages/mca run dev >/tmp/mca.log 2>&1 &
          nohup npm --prefix packages/planner run dev >/tmp/planner.log 2>&1 &
      - name: Wait for services
        run: |
          for p in 3030 7010 7020; do
            for i in {1..60}; do
              (echo > /dev/tcp/127.0.0.1/$p) >/dev/null 2>&1 && break
              sleep 1
            done
          done
      - name: Run Week 2 smoke
        run: |
          chmod +x .automation/evidence/week2/collect_evidence.sh
          DEBUG_EVIDENCE=1 ./.automation/evidence/week2/collect_evidence.sh
          cat .automation/evidence/week2/WEEK2_SUMMARY.md
          grep -q "FAIL" .automation/evidence/week2/WEEK2_SUMMARY.md && exit 1 || true
      - name: Dump logs on failure
        if: failure()
        run: |
          docker ps
          docker logs umca-minio || true
          tail -200 /tmp/gw.log /tmp/mca.log /tmp/planner.log 2>/dev/null || true

