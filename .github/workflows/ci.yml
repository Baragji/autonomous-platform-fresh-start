          echo "--- gateway log"; [ -f /tmp/gw.log ] && tail -n 200 /tmp/gw.log || echo "no gw log"
          echo "--- mca log"; [ -f /tmp/mca.log ] && tail -n 200 /tmp/mca.log || echo "no mca log"
          echo "--- planner log"; [ -f /tmp/planner.log ] && tail -n 200 /tmp/planner.log || echo "no planner log"
          echo "--- evidence dir"; ls -la .automation/evidence/week2 || true; ls -la .automation/evidence/week2/out || true

  smoke-week3:
    name: smoke-week3 (e2e)
    needs: openai-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5433/umca
      REDIS_URL: redis://localhost:6380
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
