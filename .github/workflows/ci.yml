        if: failure()
        run: |
          docker ps
          docker logs umca-minio || true
          tail -200 /tmp/gw.log /tmp/mca.log /tmp/planner.log 2>/dev/null || true

  smoke-week3:
    name: smoke-week3 (e2e)
    needs: openai-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umca
          POSTGRES_PASSWORD: umcapassword
          POSTGRES_DB: umca
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5432/umca
      REDIS_URL: redis://localhost:6379
