name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Use Compose services, values come from repo Variables/Secrets
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      REDIS_URL: ${{ vars.REDIS_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      # Prevent real LLM calls during tests
      OPENAI_API_KEY: dummy
      # Make integration tests fail if backends are unavailable
      CI_ENFORCE_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Diagnose environment
        run: |
          echo "==== Docker Version ===="
          docker version || true
          echo "==== Docker Info ===="
          docker info || true
          echo "==== Disk Space (before) ===="
          df -h
          echo "==== Files in infra ===="
          ls -R infrastructure || true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Start infrastructure (Postgres, Redis, MinIO, Tempo, Grafana)
        timeout-minutes: 15
        env:
          COMPOSE_PARALLEL_LIMIT: 2
          DOCKER_CLIENT_TIMEOUT: "600"
          COMPOSE_HTTP_TIMEOUT: "600"
        run: |
          set -e
          docker compose -f infrastructure/docker-compose.yml up -d || {
            echo "compose up failed, dumping logs";
            docker compose -f infrastructure/docker-compose.yml logs || true;
            exit 1;
          }

      - name: Wait for infra
        run: |
          tries=60
          wait_healthy() {
            local name="$1"
            local s
            while true; do
              s=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name" || true)
              if [ "$s" = "healthy" ]; then echo "$name healthy"; break; fi
              ((tries--)); if [ $tries -le 0 ]; then echo "$name not healthy"; docker ps; docker inspect "$name" || true; exit 1; fi
              sleep 2
            done
          }
          wait_healthy umca-minio
          wait_healthy umca-redis
          wait_healthy umca-postgres

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage (emit JSON summary)
        run: |
          mkdir -p .automation/evidence
          npm test -- --coverage --reporter=json | tee .automation/evidence/ci-tests.json

      - name: Enforce coverage threshold (lines >= 80%)
        run: npm run compliance:coverage

      - name: No skipped tests (fail on pending)
        run: VITEST_JSON_PATH=.automation/evidence/ci-tests.json npm run ci:no-skips

  openai-check:
    name: OpenAI Connectivity (staging)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --fund=false
      - name: Validate OpenAI key by listing models
        run: npm run ci:validate-openai

  smoke-staging:
    name: smoke-staging (e2e)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5433/umca
      REDIS_URL: redis://localhost:6380
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      LANGFUSE_PUBLIC_KEY: dummy
      LANGFUSE_SECRET_KEY: dummy
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --fund=false

      - name: Start infrastructure (Postgres, Redis, MinIO, Tempo, Grafana)
        run: docker compose -f infrastructure/docker-compose.yml up -d

      - name: Wait for infra health
        run: |
          tries=60
          wait_healthy() {
            local name="$1"; local s
            while true; do
              s=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name" || true)
              if [ "$s" = "healthy" ]; then echo "$name healthy"; break; fi
              ((tries--)); if [ $tries -le 0 ]; then echo "$name not healthy"; docker ps; docker inspect "$name" || true; exit 1; fi
              sleep 2
            done
          }
          wait_healthy umca-postgres
          wait_healthy umca-redis
          wait_healthy umca-minio

      - name: Start services in background
        run: |
          nohup npm --prefix packages/gateway run dev >/tmp/gw.log 2>&1 &
          nohup env WEEK2_PLANNER_ONLY=1 npm --prefix packages/mca run dev >/tmp/mca.log 2>&1 &
          nohup npm --prefix packages/planner run dev >/tmp/planner.log 2>&1 &

      - name: Wait for services
        shell: bash
        run: |
          for p in 3030 7010 7020; do
            echo "Waiting for :$p";
            for i in {1..60}; do
              (echo > /dev/tcp/127.0.0.1/$p) >/dev/null 2>&1 && break
              sleep 1
            done
          done

      - name: Run e2e smoke via Week 2 collector
        shell: bash
        run: |
          chmod +x .automation/evidence/week2/collect_evidence.sh
          DEBUG_EVIDENCE=1 ./.automation/evidence/week2/collect_evidence.sh
          echo "--- SUMMARY"; cat .automation/evidence/week2/WEEK2_SUMMARY.md
          if grep -q "FAIL" .automation/evidence/week2/WEEK2_SUMMARY.md; then
            echo "Smoke failed"; exit 1; fi

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "--- docker ps"; docker ps
          echo "--- docker inspect (health)"; docker inspect umca-postgres umca-redis umca-minio | jq '.[].State.Health.Status'
          echo "--- gateway log"; [ -f /tmp/gw.log ] && tail -n 200 /tmp/gw.log || echo "no gw log"
          echo "--- mca log"; [ -f /tmp/mca.log ] && tail -n 200 /tmp/mca.log || echo "no mca log"
          echo "--- planner log"; [ -f /tmp/planner.log ] && tail -n 200 /tmp/planner.log || echo "no planner log"
          echo "--- evidence dir"; ls -la .automation/evidence/week2 || true; ls -la .automation/evidence/week2/out || true

  smoke-production:
    name: smoke-production (e2e)
    needs: smoke-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # environment-protected run can be re-enabled after env creation
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://umca:umcapassword@localhost:5433/umca
      REDIS_URL: redis://localhost:6380
      MINIO_ENDPOINT: http://localhost:9000
