services:
  postgres:
    image: postgres:16
    container_name: umca-postgres
    environment:
      POSTGRES_USER: umca
      POSTGRES_PASSWORD: umcapassword
      POSTGRES_DB: umca
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umca || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - umca-net

  redis:
    image: redis:7
    container_name: umca-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - umca-net

  minio:
    image: minio/minio:latest
    container_name: umca-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data
    networks:
      - umca-net

  tempo:
    image: grafana/tempo:latest
    container_name: umca-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"   # HTTP query API
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - umca-net

  grafana:
    image: grafana/grafana:latest
    container_name: umca-grafana
    ports:
      - "3001:3001"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_HTTP_PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - umca-net

networks:
  umca-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  tempo-data:
  grafana-data:
